<?xml version="1.0" encoding="UTF-8"?>
<!--
  Reform Logo — Mark Only (square, 64x64)
  Iteration 1: "Flow" — three stacked layers merging into one.

  Used as:
    - public/logo.svg (favicon source, sidebar avatar)
    - Source for scripts/generate-favicon.py

  Palette:
    Amber gradient: #f59e0b → #d97706
    Lighter amber:  #fbbf24 → #f59e0b
-->
<svg version="1.0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Reform Logo">
  <defs>
    <linearGradient id="rf-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="rf-grad-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Back layer (lightest) -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#rf-grad-2)" opacity="0.45" />
  <!-- Middle layer -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#rf-grad-2)" opacity="0.75" transform="translate(2, 0)" />
  <!-- Front layer (full strength) -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#rf-grad)" transform="translate(4, 0)" />

  <!-- White "flow" symbol — three horizontal lines merging into a single arrow -->
  <g transform="translate(32, 32)" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none">
    <!-- Three input lines on the left -->
    <line x1="-22" y1="-10" x2="-6" y2="-10" />
    <line x1="-22" y1="0"   x2="-6" y2="0" />
    <line x1="-22" y1="10"  x2="-6" y2="10" />
    <!-- Single output arrow on the right -->
    <line x1="-6" y1="0" x2="20" y2="0" />
    <polyline points="14,-6 22,0 14,6" fill="none" />
  </g>
</svg>
