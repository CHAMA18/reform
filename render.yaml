services:
  - type: web
    name: reform
    env: node
    repo: https://github.com/CHAMA18/reform
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: XANO_INSTANCE_API
        value: https://xt8f-5r1j-wrmy.n7e.xano.io/api:meta
      - key: XANO_WORKSPACE_ID
        value: "2"
      - key: XANO_TOKEN
        sync: false  # set this manually in the Render dashboard — secret
      - key: NEXT_PUBLIC_APP_URL
        value: https://reform.onrender.com

# NOTE: This blueprint uses Xano as the backend (not a Render Postgres).
# The Xano instance + workspace + tables were provisioned at setup time
# via the Xano metadata API. See README.md → "Xano architecture" section.
